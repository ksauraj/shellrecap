name: Test

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: [stable]
        include:
          # The oldest Go that go.mod allows
          - os: ubuntu-latest
            go: '1.21'
    name: test (${{ matrix.os }}, go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      # Built like a release, so a binary the system refuses to start, like
      # macOS does without LC_UUID, fails here
      - name: Start the app
        shell: bash
        run: |
          go build -o bin/ ./cmd/shellrecap
          bin/shellrecap --version
