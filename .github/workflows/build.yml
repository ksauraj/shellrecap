name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.0.0)'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to create a release and upload assets
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v3
        with:
          go-version: '1.20' # Replace with your Go version

      - name: Set up Android NDK
        uses: android-actions/setup-android@v2
        with:
          android-components: 'ndk;21.3.6528147' # Specify the NDK version you need

      - name: Debug Environment Variables
        run: |
          echo $ANDROID_NDK_HOME
          echo $PATH
          echo $NDK_ROOT

      - name: Build and cross-compile
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }} # Access the API key from secrets
        run: |
          mkdir -p dist
          for platform in \
            android/arm android/arm64 \
            linux/amd64 linux/arm linux/arm64 \
            windows/amd64 windows/arm64 \
            darwin/amd64 darwin/arm64 \
            freebsd/amd64 freebsd/arm64 \
            openbsd/amd64 openbsd/arm64; do
            os=$(echo $platform | cut -d'/' -f1)
            arch=$(echo $platform | cut -d'/' -f2)
            if [ "$os" == "windows" ]; then
              ext=".exe"
            else
              ext=""
            fi
            output="dist/shellrecap-${os}-${arch}${ext}"
            echo "Building for $os/$arch..."
            if [ "$os" == "android" ]; then
              sudo apt-get install gcc-arm-linux-gnueabi
              export CGO_ENABLED=1
              export CC=/usr/local/lib/android/sdk/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android30-clang
              export PATH=$PATH:$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin
            else
              export CGO_ENABLED=0
            fi
            GOOS=$os GOARCH=$arch go build -ldflags "-X github.com/ksauraj/shellrecap/internal/gemini.apiKey=$GEMINI_API_KEY" -o $output ./cmd/shellrecap
          done

      - name: Create release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.event.inputs.version }}
          release_name: Release ${{ github.event.inputs.version }}
          draft: false
          prerelease: false

      - name: Upload release assets
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: dist/shellrecap-android-arm
          asset_name: shellrecap-android-arm
          asset_content_type: application/octet-stream

      - name: Upload release assets
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: dist/shellrecap-android-arm64
          asset_name: shellrecap-android-arm64
          asset_content_type: application/octet-stream

      - name: Upload release assets
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: dist/shellrecap-linux-amd64
          asset_name: shellrecap-linux-amd64
          asset_content_type: application/octet-stream

      - name: Upload release assets
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: dist/shellrecap-linux-arm
          asset_name: shellrecap-linux-arm
          asset_content_type: application/octet-stream

      - name: Upload release assets
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: dist/shellrecap-linux-arm64
          asset_name: shellrecap-linux-arm64
          asset_content_type: application/octet-stream

      - name: Upload release assets
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: dist/shellrecap-windows-amd64.exe
          asset_name: shellrecap-windows-amd64.exe
          asset_content_type: application/octet-stream

      - name: Upload release assets
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: dist/shellrecap-windows-arm64.exe
          asset_name: shellrecap-windows-arm64.exe
          asset_content_type: application/octet-stream

      - name: Upload release assets
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: dist/shellrecap-darwin-amd64
          asset_name: shellrecap-darwin-amd64
          asset_content_type: application/octet-stream

      - name: Upload release assets
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: dist/shellrecap-darwin-arm64
          asset_name: shellrecap-darwin-arm64
          asset_content_type: application/octet-stream

      - name: Upload release assets
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: dist/shellrecap-freebsd-amd64
          asset_name: shellrecap-freebsd-amd64
          asset_content_type: application/octet-stream

      - name: Upload release assets
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: dist/shellrecap-freebsd-arm64
          asset_name: shellrecap-freebsd-arm64
          asset_content_type: application/octet-stream

      - name: Upload release assets
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: dist/shellrecap-openbsd-amd64
          asset_name: shellrecap-openbsd-amd64
          asset_content_type: application/octet-stream

      - name: Upload release assets
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: dist/shellrecap-openbsd-arm64
          asset_name: shellrecap-openbsd-arm64
          asset_content_type: application/octet-stream
