name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.0.0)'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to create a release and upload assets
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # The latest Go, not go.mod's minimum: macOS refuses binaries from Go
      # before 1.22.6, which leave out the LC_UUID load command
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Test
        run: go test ./...

      - name: Build and cross-compile
        env:
          # Both keys are optional; a missing secret builds without that provider
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          mkdir -p dist
          # The runner image ships an Android NDK; cgo is needed for 32-bit
          # Android and gives both Android builds the system DNS resolver
          ndk_bin="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          pkg=github.com/ksauraj/shellrecap/internal/ai
          ldflags="-X $pkg.geminiAPIKey=$GEMINI_API_KEY -X $pkg.groqAPIKey=$GROQ_API_KEY"
          for platform in \
            android/arm android/arm64 \
            linux/amd64 linux/arm linux/arm64 \
            windows/amd64 windows/arm64 \
            darwin/amd64 darwin/arm64 \
            freebsd/amd64 freebsd/arm64 \
            openbsd/amd64 openbsd/arm64; do
            os=$(echo $platform | cut -d'/' -f1)
            arch=$(echo $platform | cut -d'/' -f2)
            if [ "$os" == "windows" ]; then
              ext=".exe"
            else
              ext=""
            fi
            output="dist/shellrecap-${os}-${arch}${ext}"
            echo "Building for $os/$arch..."
            if [ "$os" == "android" ]; then
              export CGO_ENABLED=1
              if [ "$arch" == "arm" ]; then
                export CC="$ndk_bin/armv7a-linux-androideabi21-clang"
              else
                export CC="$ndk_bin/aarch64-linux-android21-clang"
              fi
              if [ ! -x "$CC" ]; then
                echo "Android C compiler not found at $CC" >&2
                exit 1
              fi
            else
              export CGO_ENABLED=0
              unset CC
            fi
            GOOS=$os GOARCH=$arch go build -ldflags "$ldflags" -o $output ./cmd/shellrecap
          done

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release create "$VERSION" dist/* \
            --title "Release $VERSION" \
            --target "$GITHUB_SHA" \
            --generate-notes
